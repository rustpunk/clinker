[package]
name = "clinker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for the Clinker ETL engine"

# All three are on by default, so the published binary is unchanged and no
# pipeline that runs today stops running. Turning one off is for a deployment
# that wants a smaller binary or a narrower dependency graph, and a build that
# lacks a capability says so at config validation rather than at the point of
# use — see `docs/user/src/getting-started/installation.md`.
[features]
default = ["rest", "otlp", "lineage"]
# The `rest` source transport.
rest = ["dep:clinker-net"]
# OTLP/HTTP export of logs, metrics and spans to a collector. The telemetry
# arena and its admission accounting are the executor's and stay either way;
# this is the exporter that drains them.
otlp = ["dep:clinker-net"]
# OpenLineage run and column-lineage emission. `clinker-lineage` has no
# transport dependency of its own — it writes NDJSON to a file or a pipe — so
# this is a separate axis from the two above and not implied by either.
lineage = ["dep:clinker-lineage"]

[dependencies]
clinker-exec = { workspace = true }
clinker-plan = { workspace = true }
clinker-core-types = { workspace = true }
clinker-net = { workspace = true, features = [
    "transport",
], optional = true }
clinker-channel = { workspace = true }
clinker-format = { workspace = true }
clinker-record = { workspace = true }
clinker-lineage = { workspace = true, optional = true }
cxl = { workspace = true }
clap = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
chrono = { workspace = true }
num_cpus = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { version = "1", features = ["v7"] }
miette = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
clinker-exec = { workspace = true, features = ["test-utils"] }
clinker-scenarios = { workspace = true }
tempfile = { workspace = true }
insta = "1"
