[package]
name = "clinker-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Network finite-pull Source readers (REST) for Clinker"

[dependencies]
clinker-core-types = { workspace = true }
clinker-exec = { workspace = true }
clinker-plan = { workspace = true }
clinker-format = { workspace = true }
clinker-record = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
tracing = { workspace = true }
http = { workspace = true }
ureq = { workspace = true, optional = true }
rustls-graviola = { workspace = true, optional = true }

[features]
default = []
# The HTTP transports themselves — the `rest` reader's request loop and the
# OTLP exporter's send/retry loop. Endpoint admission, continuation parsing
# and redirect policy are URI and header analysis and stay compiled either
# way, so a build without this feature still holds the rules that decide what
# a transport is allowed to reach.
transport = ["dep:ureq", "dep:rustls-graviola"]

[dev-dependencies]
clinker-exec = { workspace = true, features = ["test-utils"] }
clinker-bench-support = { workspace = true }
