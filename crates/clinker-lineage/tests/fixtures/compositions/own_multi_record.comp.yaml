# A body that declares its own multi-record source. Lineage's record-type
# schema lookup remains top-level-only, so it attributes these columns to the
# catalog resource's container dataset — see the builder's documented
# limitations.
_compose:
  name: own_multi_record
  inputs:
    driver:
      schema:
        - { name: x, type: int }
  outputs:
    out: shape
  config_schema: {}
  resources_schema:
    ledger:
      kind: file
      required: true

nodes:
  - type: source
    name: ledger
    config:
      name: ledger
      type: fixed_width
      resource: ledger
      schema:
        discriminator: { start: 0, width: 1 }
        records:
          - id: header
            tag: H
            columns:
              - { name: batch_id, type: string, start: 1, width: 9 }
          - id: detail
            tag: D
            columns:
              - { name: amount, type: int, start: 1, width: 4 }
  - type: transform
    name: shape
    input: ledger
    config:
      cxl: |
        emit batch = batch_id
        emit total = amount
