[package]
name = "clinker-scenarios"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic generator for the runnable scenario corpus under examples/scenarios"

[[bin]]
name = "clinker-scenarios"
path = "src/main.rs"

[dependencies]
# Seeded Wyrand. The workspace RNG convention (see clinker-bench-support's
# generators and the production interleave path in clinker-exec); stable within
# the 2.x series, which is what makes a committed golden reproducible. A bump to
# fastrand 3 would rewrite every generated byte, so it is a GENERATOR_VERSION
# event, not a routine dependency update.
fastrand = "2"
# Digest for the generated-input fingerprint the scenario harness pins.
blake3 = { workspace = true }
# `.meta.json` sidecar only; never part of the digest.
serde_json = { workspace = true }
# Date arithmetic from a fixed epoch. No wall-clock reaches generated bytes.
chrono = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
