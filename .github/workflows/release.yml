name: Release candidate draft

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-policy:
    name: Verify dependency policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"

      - name: Test and enforce the locked Rust boundary tool
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path tools/dependency-policy/Cargo.toml --locked
          cargo run --manifest-path tools/dependency-policy/Cargo.toml --locked --offline -- --scope final --root .

  build:
    name: Build ${{ matrix.target }}
    needs: dependency-policy
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            binary_suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            binary_suffix: .exe
          - target: aarch64-apple-darwin
            os: macos-15
            binary_suffix: ""
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary_suffix: ""
    steps:
      - name: Check out the candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository toolchain target
        shell: bash
        run: |
          set -euo pipefail
          test -f rust-toolchain.toml
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"

      - name: Fetch the locked workspace dependencies
        shell: bash
        run: cargo fetch --locked

      - name: Build the governed target executables
        env:
          BUILD_TARGET: ${{ matrix.target }}
        shell: bash
        run: >-
          cargo build --locked --offline --release --target "$BUILD_TARGET"
          -p clinker -p cxl-cli

      - name: Smoke-test the native target executables
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          "target/$BUILD_TARGET/release/clinker$BINARY_SUFFIX" --version
          "target/$BUILD_TARGET/release/cxl$BINARY_SUFFIX" --version

      - name: Upload the native target executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/clinker${{ matrix.binary_suffix }}
            target/${{ matrix.target }}/release/cxl${{ matrix.binary_suffix }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  assemble-draft:
    name: Assemble and reread private draft
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux build input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release

      - name: Download the Windows build input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release

      - name: Download the Apple silicon build input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release

      - name: Download the Intel macOS build input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-x86_64-apple-darwin
          path: target/x86_64-apple-darwin/release

      - name: Build and verify the exact release asset set with Rust policy
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          cargo fetch --manifest-path tools/release-policy/Cargo.toml --locked
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml --locked --offline -- \
            inventory check --print-json
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml --locked --offline -- \
            release build-bundle \
            --target x86_64-unknown-linux-gnu \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --output-dir artifacts
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml --locked --offline -- \
            release build-bundle \
            --target x86_64-pc-windows-msvc \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --output-dir artifacts
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml --locked --offline -- \
            release build-bundle \
            --target aarch64-apple-darwin \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --output-dir artifacts
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml --locked --offline -- \
            release build-bundle \
            --target x86_64-apple-darwin \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --output-dir artifacts
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml --locked --offline -- \
            release verify assemble \
            --asset-dir artifacts \
            --repository "$RELEASE_REPOSITORY" \
            --workflow .github/workflows/release.yml \
            --ref "$RELEASE_REF" \
            --source-sha "$RELEASE_SOURCE_SHA"

      - name: Attest the verified release archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip

      - name: Stage and freshly verify the private draft with the Rust gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_CANDIDATE_TAG: ${{ github.ref_name }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml --locked --offline -- \
            release stage-candidate-draft \
            --repo "$RELEASE_REPOSITORY" \
            --candidate-tag "$RELEASE_CANDIDATE_TAG" \
            --source-sha "$RELEASE_SOURCE_SHA" \
            --asset-dir artifacts \
            --deadline-seconds 600
