name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Auto-update PR branches rebases open PRs with the default GITHUB_TOKEN, and
  # pushes made with that token never start a workflow run. Manual dispatch is
  # therefore the only way to re-validate a rebased branch without pushing to it.
  # Dispatched runs report against the selected branch rather than the PR's merge
  # ref, so they appear in the Actions tab instead of the PR's check list.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only speeds iterative local rebuilds; in CI every
  # build is effectively from-scratch, so it just bloats target/ — a disk-
  # pressure source on the multi-build check job below.
  CARGO_INCREMENTAL: "0"

permissions: {}

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
          components: clippy, rustfmt

      - name: Fetch locked boundary dependencies
        run: cargo fetch --manifest-path tools/dependency-policy/Cargo.toml --locked

      - name: Format the detached boundary tool
        run: cargo fmt --manifest-path tools/dependency-policy/Cargo.toml --all -- --check

      - name: Lint the detached boundary tool
        run: >-
          cargo clippy --manifest-path tools/dependency-policy/Cargo.toml
          --all-targets --locked --offline -- -D warnings

      - name: Exercise the boundary regression suite
        run: cargo test --manifest-path tools/dependency-policy/Cargo.toml --locked --offline

      - name: Enforce the final repository boundary
        run: >-
          cargo run --manifest-path tools/dependency-policy/Cargo.toml
          --locked --offline -- --scope final --root .

  # Two things nothing else checks, because everything else builds the default
  # binary on a runner that happens to have a C compiler.
  #
  # The first is the pure-Rust pillar. `cargo build` succeeding proves nothing
  # about it here: a `cc`-invoking build script would simply find the compiler
  # and work. Pointing every variable a build script consults at a program that
  # fails is what makes the claim testable — a dependency that starts needing a
  # toolchain fails this job instead of failing whoever first builds without one.
  #
  # The second is the capability features. Each is gated at the call sites of
  # one subsystem, and a `#[cfg]` that stops matching produces code that builds
  # in whichever combination someone happens to compile and not in the others.
  build-portability:
    name: Build portability
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Job-level rather than per-step. Two step-level copies would be two places
    # that must agree, and the dangerous drift is removal: drop a variable from
    # the build step but leave it in the negative control, and the control still
    # fails in `cc` — a green tick — while the workspace build can now reach a
    # real compiler through the un-neutralized variable.
    #
    # The two steps that need a working compiler unset these by name with
    # `env -u`. Note what that does and does not catch: adding a name here
    # without adding it to both `env -u` lists breaks those steps loudly, but
    # *removing* one here while leaving it in an `env -u` list is silent, since
    # `env -u` on an unset variable is a no-op. Treat this block and the two
    # `env -u` lists as one edit.
    env:
      CC: /bin/false
      CXX: /bin/false
      AR: /bin/false
      CC_x86_64_unknown_linux_gnu: /bin/false
      CXX_x86_64_unknown_linux_gnu: /bin/false
      AR_x86_64_unknown_linux_gnu: /bin/false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This job now builds every workspace target, a second `clinker`
      # resolution, the fixture twice, and every capability-feature combination,
      # all into one `target/`. That is the pattern that has exhausted the hosted
      # runner's root volume mid-link elsewhere in this file.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The whole workspace including dev, test, and bench targets, because that is
      # the scope the README and the installation guide claim. Then the binary with
      # no network capability at all, which is a different graph rather than a
      # subset — it confirms the smaller resolution did not acquire a toolchain
      # requirement of its own.
      #
      # `CC` and friends are consumed by build scripts, not by rustc's choice of
      # linker driver, so linking still works here through the real `cc` on PATH.
      - name: Build with no working C compiler
        run: |
          cargo build --locked --workspace --all-targets
          cargo build --locked -p clinker --no-default-features

      # The negative control. The step above passes both when nothing in the graph
      # compiles C and when the mechanism has quietly stopped working, and from the
      # outside those are the same green tick. `tools/no-c-gate-fixture` compiles one
      # C file through the real `cc` crate — the real crate, because what is under
      # test is whether the environment above covers the variables a genuine
      # C-compiling build script consults, and only `cc` knows that set.
      #
      # Both directions are checked, and the failure is matched against its cause.
      # "The build failed" on its own is not evidence: a fetch error or a stale
      # lockfile would satisfy it while proving nothing, which is the same defect as
      # the `grep` this job used to run against `cargo tree`.
      #
      # The fixture is excluded from the root workspace, so nothing else builds it,
      # and nothing else lints it either — hence the format and lint passes here.
      - name: Prove the no-C gate bites
        run: |
          # The control has to exercise the same toolchain-discovery crates the
          # workspace's build scripts do, because which environment variables get
          # read is version-specific. Every package the two lockfiles share must
          # agree, not just `cc`: `cc` delegates MSVC toolchain and environment
          # discovery to `find-msvc-tools`, so a divergence there is a divergence
          # in half the variable set this control exists to certify.
          # Only inside `[[package]]` blocks: a lockfile opens with its own
          # top-level `version = N` format field, which would otherwise be
          # emitted as a nameless entry and compared as if it were a crate.
          lock_versions() {
            awk '/^\[\[package\]\]/ { in_pkg = 1; n = ""; next }
                 in_pkg && /^name = / { gsub(/"/, ""); n = $3; next }
                 in_pkg && /^version = / && n != "" {
                   gsub(/"/, ""); print n, $3; in_pkg = 0 }' "$1" | sort
          }
          lock_versions tools/no-c-gate-fixture/Cargo.lock \
            >"${RUNNER_TEMP}/fixture-lock.txt"
          lock_versions Cargo.lock >"${RUNNER_TEMP}/workspace-lock.txt"

          if ! grep -q '^cc ' "${RUNNER_TEMP}/fixture-lock.txt"; then
            echo "the negative control no longer depends on cc, so it cannot"
            echo "compile C and cannot demonstrate anything."
            exit 1
          fi
          if ! grep -q '^cc ' "${RUNNER_TEMP}/workspace-lock.txt"; then
            # The end state this whole guarantee points at. There is nothing left
            # to reconcile the control against, and that is a success, not a break
            # — the failure mode this branch exists to avoid.
            echo "cc has left the workspace lockfile entirely; no shared version"
            echo "to reconcile, and the control still compiles C on its own."
          else
            join "${RUNNER_TEMP}/fixture-lock.txt" \
                 "${RUNNER_TEMP}/workspace-lock.txt" >"${RUNNER_TEMP}/shared.txt"
            mismatched=$(awk '$2 != $3 {
              print "  " $1 ": control has " $2 ", workspace has " $3 }' \
              "${RUNNER_TEMP}/shared.txt")
            if [ -n "$mismatched" ]; then
              echo "the negative control and the workspace disagree on a shared"
              echo "dependency, so the control certifies coverage of a variable"
              echo "set the workspace does not read:"
              echo "$mismatched"
              echo "Re-pin tools/no-c-gate-fixture to the workspace's versions."
              exit 1
            fi
            echo "control and workspace agree on all shared packages:"
            sed 's/^/  /' "${RUNNER_TEMP}/shared.txt"
          fi

          # Direction 1: with a working toolchain the fixture must build. A fixture
          # that can never build would fail the next check for its own reasons and
          # report a working gate regardless of the gate. `env -u` rather than
          # re-stating values, so the job-level block stays the only place the
          # variables are assigned — see the caveat on that block about removal.
          if ! env -u CC -u CXX -u AR \
                 -u CC_x86_64_unknown_linux_gnu \
                 -u CXX_x86_64_unknown_linux_gnu \
                 -u AR_x86_64_unknown_linux_gnu \
                 cargo build --locked \
                   --manifest-path tools/no-c-gate-fixture/Cargo.toml \
                   >"${RUNNER_TEMP}/fixture-ok.log" 2>&1; then
            echo "the negative control is broken: it does not build even with a"
            echo "working C compiler, so it cannot demonstrate anything."
            tail -30 "${RUNNER_TEMP}/fixture-ok.log"
            exit 1
          fi

          # Direction 2: under the job's environment it must fail, and fail in cc.
          if cargo build --locked \
               --manifest-path tools/no-c-gate-fixture/Cargo.toml \
               --target-dir "${RUNNER_TEMP}/fixture-no-cc" \
               >"${RUNNER_TEMP}/red-gate.log" 2>&1; then
            echo "the no-C gate did not bite: a cc-invoking build script compiled"
            echo "with every C-compiler variable pointed at /bin/false."
            exit 1
          fi
          if ! grep -q "error occurred in cc-rs" "${RUNNER_TEMP}/red-gate.log"; then
            echo "the fixture failed, but not in the C compiler — so this run says"
            echo "nothing about the gate. Failure was:"
            tail -30 "${RUNNER_TEMP}/red-gate.log"
            exit 1
          fi
          echo "gate bit as required; the fixture failed in cc:"
          grep "error occurred in cc-rs" "${RUNNER_TEMP}/red-gate.log" | head -1

      - name: Check the negative control's own source
        run: |
          cargo fmt --manifest-path tools/no-c-gate-fixture/Cargo.toml --all -- --check
          env -u CC -u CXX -u AR \
            -u CC_x86_64_unknown_linux_gnu \
            -u CXX_x86_64_unknown_linux_gnu \
            -u AR_x86_64_unknown_linux_gnu \
            cargo clippy --manifest-path tools/no-c-gate-fixture/Cargo.toml \
              --all-targets --locked -- -D warnings

      # This check has three outcomes, not two, and conflating any pair of them
      # gets it wrong.
      #
      #   - `ring` is in the lockfile but reaches nothing: exit 0, empty stdout,
      #     `warning: nothing to print.` on stderr. This is today's state — it is
      #     locked as `rustls-webpki`'s inactive optional dependency. PASS.
      #   - `ring` is absent from the lockfile entirely: exit 101, `package ID
      #     specification 'ring' did not match any packages`. This is the *best*
      #     state this guarantee can be in, so it must PASS — treating a non-zero
      #     exit as "the check did not run" would turn a `rustls-webpki` bump that
      #     drops the optional edge into a red build.
      #   - anything else non-zero: the check genuinely did not run. FAIL, rather
      #     than reporting on a resolution that never happened.
      #
      # Which is why the status is read from the command and not from a `grep`
      # downstream of a pipe: a pipe reports grep's status, and a `cargo tree`
      # that failed then produces no output, no match, and a green step.
      # `--target all` because a ring edge reachable only from the Windows or
      # macOS resolution is still a ring edge.
      - name: Refuse a ring edge in any resolution
        run: |
          if ! cargo tree --locked --workspace --all-features --target all \
                 --invert ring \
                 >"${RUNNER_TEMP}/ring.txt" 2>"${RUNNER_TEMP}/ring.err"; then
            if grep -q "did not match any packages" "${RUNNER_TEMP}/ring.err"; then
              # cargo emits this for any spec it cannot resolve, so on its own it
              # cannot tell "ring is gone" from "we asked about a name that does
              # not exist". A rename or typo in the argument above would otherwise
              # land here and report success on every future run, with the
              # guarantee silently switched off. Confirm the absence against the
              # lockfile directly, against a name this check hardcodes.
              if grep -q '^name = "ring"$' Cargo.lock; then
                echo "cargo tree resolved no such package, yet ring IS in"
                echo "Cargo.lock — this check is asking about the wrong name."
                exit 1
              fi
              echo "ring is not in the lockfile at all — the strongest form of this"
              echo "guarantee."
              exit 0
            fi
            echo "cargo tree failed, so the ring check did not run:"
            cat "${RUNNER_TEMP}/ring.err"
            exit 1
          fi
          if [ -s "${RUNNER_TEMP}/ring.txt" ]; then
            echo "ring is back in the dependency graph; it builds C through cc"
            cat "${RUNNER_TEMP}/ring.txt"
            exit 1
          fi

      - name: Build every capability-feature combination
        run: bash scripts/check-feature-combinations.sh

  release-policy:
    name: Release policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
          components: clippy, rustfmt

      - name: Fetch locked policy dependencies
        run: |
          cargo fetch --manifest-path tools/dependency-policy/Cargo.toml --locked
          cargo fetch --manifest-path tools/release-policy/Cargo.toml --locked

      - name: Format the detached policy gate
        run: cargo fmt --manifest-path tools/release-policy/Cargo.toml --all -- --check

      - name: Lint the detached policy gate
        run: >-
          cargo clippy --manifest-path tools/release-policy/Cargo.toml
          --all-targets --locked --offline -- -D warnings

      - name: Exercise the detached policy gate
        run: cargo test --manifest-path tools/release-policy/Cargo.toml --locked --offline

      - name: Validate the live release inventory
        run: >-
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml
          --locked --offline -- inventory check --print-json

      - name: Verify repository workflow trust
        run: >-
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml
          --locked --offline -- workflow verify

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reclaim ~25-30 GB of preinstalled SDKs the Rust build never touches.
      # This job compiles the whole workspace several times over (two clippy
      # passes, the test build, and three bench-compile steps) into one shared
      # target/, which can exhaust the hosted runner's root volume mid-link.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check AI documentation
        run: bash scripts/check-ai-docs.sh

      - run: cargo fmt --all --check
      # Two clippy passes. The first omits --all-targets on purpose: with
      # test targets excluded, a pub(crate) item referenced only from
      # #[cfg(test)] code still trips the dead-code lint, so the dead-code
      # gate keeps working. The second adds --all-targets to lint test,
      # bench, and example code that the first pass never compiles.
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Example pipelines double as runnable documentation and a smoke-test
      # surface, so every top-level pipeline under examples/pipelines/ must at
      # least compile through the plan-only `--explain` path. This catches
      # config-schema and CXL-grammar drift at the boundary instead of leaving a
      # reader to trip over a stale example. `cargo test` above already exercises
      # the same gate via crates/clinker/tests/examples_explain.rs; this step is
      # the fast, explicit signal and keeps the smoke command discoverable.
      - name: Smoke-check example pipelines (--explain)
        run: |
          cargo build --locked -p clinker
          bin="$PWD/target/debug/clinker"
          cd examples/pipelines
          rc=0
          for f in *.yaml; do
            if "$bin" run "$f" --explain >/dev/null; then
              echo "ok: $f"
            else
              echo "FAIL: $f did not pass --explain"
              rc=1
            fi
          done
          exit $rc

      # The --explain gate above proves a pipeline COMPILES. It cannot prove the
      # engine computes the right answer: a pipeline can plan cleanly, run
      # cleanly, exit 0 and write silently wrong output. The scenario corpus
      # closes that gap — it generates its input, executes the real CLI, and
      # compares every output byte-for-byte against a committed golden.
      # `cargo test` above already runs this via crates/clinker/tests/scenarios.rs
      # on all three platforms; this step is the fast, explicit signal and keeps
      # the command discoverable, matching the --explain step's rationale.
      - name: Execute scenario corpus against committed goldens
        run: cargo test --locked -p clinker --test scenarios

      # Bench infrastructure CI gate (compile + smoke)
      - run: cargo check --benches --workspace
      - run: cargo check --features bench-alloc -p clinker-benchmarks
      - run: cargo test --benches -p clinker-benchmarks

  # Execute the full suite on the other two first-class targets. These runners
  # link natively, which the ubuntu cross-check job below cannot do without an
  # MSVC/Apple cross-linker. Nothing here needs a C toolchain — TLS runs on
  # rustls with the graviola provider, which has no build script. This is where
  # the platform `#[cfg(windows)]` / `#[cfg(target_os = "macos")]` test
  # modules — including the de-gated RSS-validity assertions — actually run.
  test-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

  test-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check AI documentation portability
        run: |
          bash scripts/check-ai-docs.sh --self-test
          bash scripts/check-ai-docs.sh
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

  # Type-check the non-Linux targets from the ubuntu host. `--all-targets`
  # so test and bench targets compile too — a #[cfg(windows)] /
  # #[cfg(target_os = "macos")] branch that fails to build now fails CI
  # here, not only when a native runner reaches it.
  #
  # This covers the whole workspace. It used to exclude clinker-net and
  # clinker, whose TLS stack reached `ring`, whose build script needs a cross
  # C toolchain the ubuntu host does not have; with the provider now graviola,
  # which has no build script at all, both cross-check like everything else.
  cross-platform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: >-
          cargo check --all-targets --target x86_64-pc-windows-msvc
          -p clinker-exec -p clinker-plan -p clinker-schema
          -p clinker-channel -p cxl-cli -p clinker-lineage
          -p clinker-net -p clinker
      - run: >-
          cargo check --all-targets --target aarch64-apple-darwin
          -p clinker-exec -p clinker-plan -p clinker-schema
          -p clinker-channel -p cxl-cli -p clinker-lineage
          -p clinker-net -p clinker

  # Positive remote-publication evidence is limited to these disposable,
  # self-provisioned Linux loopback profiles. A missing package, mount,
  # lifecycle/capacity observation, or teardown fails its cell and leaves the
  # schema-3 evidence explicitly ineligible for a support claim. Each server
  # root is backed by a mounted 64 MiB tmpfs so ENOSPC is observed through the
  # mounted client rather than inferred from an injected fault.
  filesystem-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile:
          - linux-nfsv4.1-loopback-ci
          - linux-smb3.1.1-loopback-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.91"

      - name: Fetch locked policy dependencies
        run: cargo fetch --manifest-path tools/release-policy/Cargo.toml --locked

      - name: Validate filesystem matrix contract
        run: >-
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml
          --locked --offline -- filesystem self-test

      - name: Provision and exercise exact remote profile
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/filesystem-${{ matrix.profile }}.json
        run: >-
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml
          --locked --offline -- filesystem provision-and-run
          --profile "${{ matrix.profile }}"
          --evidence "${EVIDENCE_PATH}"

      - name: Unconditionally teardown exact remote profile
        if: always()
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/filesystem-${{ matrix.profile }}.json
        run: >-
          cargo run --quiet --manifest-path tools/release-policy/Cargo.toml
          --locked --offline -- filesystem teardown
          --profile "${{ matrix.profile }}"
          --evidence "${EVIDENCE_PATH}"

      - name: Unconditionally upload bounded profile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filesystem-${{ matrix.profile }}-evidence
          path: ${{ runner.temp }}/filesystem-${{ matrix.profile }}*
          if-no-files-found: error
          retention-days: 14

  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
