pipeline:
  name: bench-filter-selectivity

nodes:
  # Keep each selectivity path independent until source fan-out is safe (#908).
  - type: source
    name: source_90pct
    config:
      name: source_90pct
      type: csv
      path: bench://input_90.csv
      options:
        has_header: true
      schema:
        - { name: f0, type: int }
        - { name: f1, type: string }

  - type: source
    name: source_50pct
    config:
      name: source_50pct
      type: csv
      path: bench://input_50.csv
      options:
        has_header: true
      schema:
        - { name: f0, type: int }
        - { name: f1, type: string }

  - type: source
    name: source_10pct
    config:
      name: source_10pct
      type: csv
      path: bench://input_10.csv
      options:
        has_header: true
      schema:
        - { name: f0, type: int }
        - { name: f1, type: string }

  - type: transform
    name: filter_90pct
    input: source_90pct
    config:
      cxl: |
        filter f0 > 100000
        emit out = f0

  - type: transform
    name: filter_50pct
    input: source_50pct
    config:
      cxl: |
        filter f0 > 500000
        emit out = f0

  - type: transform
    name: filter_10pct
    input: source_10pct
    config:
      cxl: |
        filter f0 > 900000
        emit out = f0

  - type: sink
    name: high_pass
    input: filter_90pct
    config:
      name: high_pass
      type: csv
      path: bench://output_90.csv
      include_unmapped: true

  - type: sink
    name: mid_pass
    input: filter_50pct
    config:
      name: mid_pass
      type: csv
      path: bench://output_50.csv
      include_unmapped: true

  - type: sink
    name: low_pass
    input: filter_10pct
    config:
      name: low_pass
      type: csv
      path: bench://output_10.csv
      include_unmapped: true
