# cargo-deny configuration for clinker
#
# Licence and advisory policy, plus a name-level ban on `cmake`. It does NOT
# enforce the workspace's no-C-toolchain guarantee, and the header used to say
# it did: a name blocklist cannot see the difference between a build script
# that calls a C compiler and one that merely declares `cc` and never runs it.
# `blake3` is exactly that case — `cc` is in the lockfile as its
# build-dependency and, under the `pure` feature this workspace pins, is never
# invoked. Banning `cc` by name would refuse a graph that compiles no C.
#
# What enforces the guarantee is the `Build portability` CI job, which builds
# the workspace with every C-compiler environment variable pointed at a program
# that fails. A build script that invokes one fails there; one that only
# declares the dependency does not.
#
# Run: cargo deny check

[bans]
multiple-versions = "warn"
deny = [
    # cmake is banned by name because, unlike `cc`, its presence in the graph
    # is not separable from running it: a crate that depends on the `cmake`
    # crate does so in order to drive a CMake build.
    { name = "cmake" },
]
skip = [
    # Cross-platform dependencies commonly pull multiple Windows support
    # crate versions into the lockfile.
    { name = "windows-sys" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "Zlib",
    # Mozilla's CA trust-anchor list (webpki-roots, pulled by ureq's
    # rustls TLS) ships under this permissive data-sharing license. It
    # covers the root-certificate *data*, not code, and imposes no
    # copyleft on the dependent crate.
    "CDLA-Permissive-2.0",
]

[advisories]
yanked = "deny"
unmaintained = "all"
