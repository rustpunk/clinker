# Normalize an email address, validate its shape, and extract its domain.
_compose:
  name: "Validate Email"
  inputs:
    input:
      required: true
      schema:
        - { name: email, type: string }
  outputs:
    output:
      ref: extract_domain
      description: Original email plus normalized value, validity, and domain
  config_schema: {}

nodes:
  - type: transform
    name: normalize_email
    input: input
    config:
      cxl: |
        emit email_lower = email.trim().lower()
  - type: transform
    name: check_email_format
    input: normalize_email
    config:
      cxl: |
        emit email_valid = email_lower.matches("^[^@]+@[^@]+\\.[^@]+$")
  - type: transform
    name: extract_domain
    input: check_email_format
    config:
      cxl: |
        emit email_domain = email_lower.capture("@(.+)", 1)
