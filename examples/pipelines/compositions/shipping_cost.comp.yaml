# Calculate shipment weight, method rate, and total shipping cost.
_compose:
  name: "Shipping Cost"
  inputs:
    input:
      required: true
      schema:
        - { name: weight_kg, type: float }
        - { name: shipping_method, type: string }
        - { name: quantity, type: int }
  outputs:
    output:
      ref: total_shipping
      description: Original fields plus shipment weight, rate, and total cost
  config_schema: {}

nodes:
  - type: transform
    name: compute_weight
    input: input
    config:
      cxl: |
        emit shipping_weight = weight_kg * quantity.to_float()
  - type: transform
    name: base_rate
    description: Rate per kg by shipping method
    input: compute_weight
    config:
      cxl: |
        emit base_shipping = if shipping_method == "express" then 2.50 else if shipping_method == "overnight" then 4.75 else 1.20
  - type: transform
    name: total_shipping
    input: base_rate
    config:
      cxl: |
        emit shipping_cost = shipping_weight * base_shipping
