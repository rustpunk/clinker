# Classify order value, urgency, age, fulfillment risk, and composite score.
_compose:
  name: "Order Classification"
  inputs:
    input:
      required: true
      schema:
        - { name: line_total, type: float }
        - { name: shipping_method, type: string }
        - { name: status, type: string }
        - { name: order_date_parsed, type: date }
  outputs:
    output:
      ref: order_score
      description: Original fields plus classification, age, risk, and score fields
  config_schema:
    as_of_date:
      type: string
      required: true
      description: ISO date used to calculate order age

nodes:
  - type: transform
    name: value_tier
    description: Classify by order value
    input: input
    config:
      cxl: |
        emit value_tier = if line_total >= 1000.0 then "premium" else if line_total >= 250.0 then "standard" else "economy"
  - type: transform
    name: priority_level
    description: Derive priority from method and value
    input: value_tier
    config:
      cxl: |
        emit priority_level = if shipping_method == "overnight" then "urgent" else if shipping_method == "express" and line_total >= 500.0 then "high" else if line_total >= 1000.0 then "high" else "normal"
  - type: transform
    name: order_age
    input: priority_level
    config:
      cxl: |
        let as_of = $config.as_of_date.to_date("%Y-%m-%d")
        emit days_since_order = as_of.diff_days(order_date_parsed)
  - type: transform
    name: fulfillment_risk
    description: Flag stale or high-value unshipped orders
    input: order_age
    config:
      cxl: |
        emit fulfillment_risk = if status == "pending" and days_since_order > 7 then "overdue" else if status == "pending" and value_tier == "premium" then "watch" else "ok"
  - type: transform
    name: order_score
    description: Composite score for sorting/reporting
    input: fulfillment_risk
    config:
      cxl: |
        let tier_weight = if value_tier == "premium" then 3.0 else if value_tier == "standard" then 2.0 else 1.0
        let urgency_weight = if priority_level == "urgent" then 3.0 else if priority_level == "high" then 2.0 else 1.0
        emit order_score = tier_weight * urgency_weight * (1.0 + days_since_order.to_float() / 30.0)
