_compose:
  name: "Clean Names"
  inputs:
    input:
      description: Names to normalize
      required: true
      schema:
        - { name: first_name, type: string }
        - { name: last_name, type: string }
  outputs:
    output:
      ref: normalize_names
      description: Original fields plus normalized display and key fields
  config_schema: {}

nodes:
  - type: transform
    name: normalize_names
    input: input
    config:
      cxl: |
        emit full_name = first_name.trim() + " " + last_name.trim()
        emit name_key = (first_name.trim() + "_" + last_name.trim()).lower()
