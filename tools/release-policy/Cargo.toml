[package]
name = "clinker-release-policy"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "=0.4.44", default-features = false, features = ["std"] }
clap = { version = "=4.6.0", features = ["derive"] }
nix = { version = "=0.31.2", features = ["fs", "process", "resource", "signal"] }
regex = "=1.12.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde-saphyr = "=0.0.23"
serde_json = "=1.0.149"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
wait-timeout = "=0.2.1"

[workspace]
resolver = "2"
