[package]
name = "clinker-no-c-gate-fixture"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A crate that deliberately compiles C, so the no-C-toolchain gate can be shown to fail"
publish = false

# Detached from the root workspace, and listed in the root `exclude`. Its own
# lockfile is invisible to the dependency-policy digest, which reads the root
# `Cargo.lock` only, and its crate is invisible to `cargo tree --workspace`. That
# isolation is the point: this crate exists to compile C, which the workspace it
# guards must never do.
[workspace]

[build-dependencies]
# The real `cc` crate rather than a hand-rolled `Command`. What is under test is
# whether the CI job's environment covers the variables a genuine C-compiling
# build script consults, and only `cc` itself knows the full set.
#
# Pinned exactly to the version the root `Cargo.lock` resolves, because "the
# variables `cc` consults" is version-specific — newer releases read overrides
# older ones ignore. A control on a different version would certify coverage of
# a set that is not the one the workspace's build scripts actually read. The
# `Build portability` job compares the two lockfiles and fails if they diverge,
# so this pin cannot silently drift out of step with the workspace.
cc = "=1.2.58"

# Not called from here. Pinned because `cc` delegates MSVC toolchain and
# environment discovery to it, so it is part of the variable set this control
# would certify on Windows — and `cc` requires it through a caret range, so
# without an exact requirement stated here any `cargo update` drifts it away from
# the workspace's resolution. A direct entry is the only place Cargo lets a
# transitive version be fixed.
#
# CI asserts parity on `cc` only: the `Build portability` job runs on Linux and
# neutralizes the Linux compiler variables, so it never exercises the MSVC
# discovery this crate governs. Asserting a version the job cannot exercise was
# how the parity check grew the machinery that kept breaking it. The pin stays so
# the divergence cannot happen silently; it is simply not what the gate proves.
find-msvc-tools = "=0.1.9"
