[workspace]
resolver = "2"
exclude = [
    "tools/dependency-policy",
    "tools/release-policy",
    # Compiles C on purpose, as the negative control for the no-C-toolchain gate.
    # Excluded so it never enters this workspace's graph, lockfile, or `cargo tree`.
    "tools/no-c-gate-fixture",
]
members = [
    "crates/clinker-record",
    "crates/cxl",
    "crates/cxl-cli",
    "crates/clinker-format",
    "crates/clinker-core-types",
    "crates/clinker-plan",
    "crates/clinker-exec",
    "crates/clinker-net",
    "crates/clinker-channel",
    "crates/clinker",
    "crates/clinker-schema",
    "crates/clinker-lineage",
    "crates/clinker-bench-support",
    "crates/clinker-benchmarks",
    "crates/clinker-scenarios",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clinker-record = { path = "crates/clinker-record" }
cxl = { path = "crates/cxl" }
clinker-format = { path = "crates/clinker-format" }
clinker-core-types = { path = "crates/clinker-core-types" }
clinker-plan = { path = "crates/clinker-plan" }
clinker-exec = { path = "crates/clinker-exec" }
clinker-net = { path = "crates/clinker-net" }
clinker-channel = { path = "crates/clinker-channel" }
clinker-schema = { path = "crates/clinker-schema" }
clinker-lineage = { path = "crates/clinker-lineage" }

toml = "0.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde-saphyr = { version = "=0.0.23", features = ["miette"] }
chrono = { version = "0.4", features = ["serde"] }
miette = { version = "7", features = ["fancy"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
ahash = "0.8"
indexmap = { version = "2", features = ["serde"] }
# Field-value string storage for `Value::String`: short strings (<=23 bytes,
# the dominant ETL field shape) live inline with zero heap allocation; longer
# strings are Arc-backed for O(1) shared clones. The `serde` feature is left
# off — the hand-written `Value` (de)serialize impls go through `&str`, so the
# wire form is unchanged. `default-features = false` with only `std` enabled
# keeps smol_str's optional `borsh` feature off, so borsh is never compiled
# into the build graph (we never serialize via borsh); `std` preserves the
# inline + Arc storage and the AsRef<str>/From impls the code relies on. (Cargo
# still lists borsh under smol_str in Cargo.lock as a declared-but-unactivated
# optional dep; it compiles nowhere — confirmed via `cargo tree -i borsh`.)
# Maintained in-tree at rust-lang/rust-analyzer/lib/smol_str.
smol_str = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
arc-swap = "1.9"
static_assertions = "1"
# `pure` is misleadingly named: on blake3 1.x it does NOT mean scalar. It
# compiles the SSE2/SSE4.1/AVX2 paths as Rust `std::arch` intrinsics and
# dispatches them at runtime, so source-staging copies do get SIMD. That much is
# measured rather than assumed — forcing the AVX2 path off halves throughput.
# What `pure` gives up is the hand-written assembly and the AVX-512 kernels, and
# those are built by invoking a C toolchain through blake3's `cc`
# build-dependency, which the workspace's pure-Rust pillar (no C build
# dependencies in clinker crates) forbids.
#
# It is a real cost rather than a free trade, and the comment here used to claim
# otherwise. Measured on one x86_64 host, `pure` hashes at ~85% of the assembly
# build's throughput at the same instruction set, and at ~57% once the assembly
# build is allowed the AVX-512 kernels `pure` has no equivalent for. The pillar
# is the binding constraint and this is its price; the figures, the method, and
# what they do not cover are in docs/ai/60_PERFORMANCE_NOTES.md.
blake3 = { version = "1", default-features = false, features = ["pure"] }
uuid = { version = "1", features = ["v4"] }
crossbeam-channel = "0.5"
# Cross-platform free-space query for the spill-volume startup preflight.
# `available_space` wraps statvfs on unix and GetDiskFreeSpaceExW on Windows,
# returning the bytes available to a non-privileged user. The maintained
# successor to the unmaintained `fs2`; built on `rustix`, so it adds no libc
# or C build dependency (it satisfies the workspace pure-Rust pillar). The
# `sync` feature is the only one enabled — no async runtime is pulled in.
fs4 = { version = "1", default-features = false, features = ["sync"] }
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = "3"
petgraph = "0.8"
fastrand = "2"
quick-xml = "0.41"
# URI, header-name and header-map vocabulary. This is the same `http` crate
# ureq re-exports as `ureq::http`, so naming it directly adds no crate to the
# graph — it separates the admission and continuation policy, which is pure
# URI and header analysis, from the transport that carries it. That policy
# then compiles and is tested with `clinker-net`'s `transport` feature off.
http = "1"
# Synchronous HTTP client for the `rest` source transport and the OTLP
# exporter, behind `clinker-net/transport`. `default-features = false` drops
# the native-tls path so no openssl/native-tls/cmake enters the graph.
#
# The feature set is ureq's own `rustls` split back into its two halves.
# `rustls` expands to `rustls-no-provider + _ring + rustls-webpki-roots`, and
# the `_ring` third is what pulled ring — whose build script compiles C and
# per-architecture assembly through `cc` — into every default build of the
# workspace, contradicting the pure-Rust pillar. Naming the other two halves
# directly keeps the Mozilla webpki root store exactly as it was and leaves
# the crypto provider unset, so `clinker-net` installs graviola on the agent
# it builds. ureq only falls back to ring when no provider is configured, and
# with `_ring` off that fallback is a compile-time-absent path.
ureq = { version = "3", default-features = false, features = [
    "rustls-no-provider",
    "rustls-webpki-roots",
] }
# Pure-Rust rustls crypto provider, from the rustls author. Replaces ring as
# the provider behind the `rest` and OTLP transports: same formally-verified
# s2n-bignum field arithmetic, but shipped as Rust and inline assembly with no
# build script, so no C toolchain is needed to build clinker. Limited to
# `x86_64` and `aarch64`, which is every target this workspace builds for.
rustls-graviola = "0.4"
clinker-bench-support = { path = "crates/clinker-bench-support" }
clinker-scenarios = { path = "crates/clinker-scenarios" }
tempfile = "3"
postcard = { version = "1", default-features = false, features = ["use-std"] }
proptest = "1.11"
# Exact base-10 fixed-point arithmetic for the `decimal` column type
# (monetary/financial data). `Decimal` is a 16-byte `Copy + Hash + Eq + Ord`
# value that fits inside the existing 32-byte `Value` enum. `default-features
# = false` drops the crate's optional `serde`/`db`/`rand` integrations; only
# `std` is enabled. Spill (de)serialization goes through the deterministic,
# exact `Decimal::serialize() -> [u8; 16]` / `deserialize([u8; 16])` pair
# rather than the crate's serde format, so the `serde` feature is intentionally
# left off. Pure Rust, no C build step — satisfies the workspace pure-Rust
# pillar.
rust_decimal = { version = "1", default-features = false, features = ["std"] }
# Output-destination collision keys (clinker-plan `config::fs_type`). Two paths
# name one file on a filesystem that folds case, normalizes, or both, so the
# key deciding "same destination" has to fold and normalize the way the volume
# does. `unicode-case-mapping::case_folded` is the **simple** (C+S) fold: one
# scalar to one scalar, and `ß` folds to itself. That is the fold filesystems
# implement, and it is why the obvious alternative — the `caseless` crate,
# whose `canonical_caseless_match_str` is literally Unicode D145 — is wrong
# here: its fold is *full*, so it would call `straße.csv` and `strasse.csv`
# one file when no filesystem agrees. `unicode-normalization` supplies the NFD
# half; the two axes are independent (NTFS folds without normalizing,
# case-sensitive APFS normalizes without folding), so both crates are
# load-bearing and neither substitutes for the other. Pure Rust, no C build
# step; unicode-case-mapping has no dependencies at all.
unicode-case-mapping = "1.0"
unicode-normalization = "0.1"

[workspace.metadata.release]
shared-version = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = "none"
